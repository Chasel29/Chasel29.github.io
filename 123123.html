<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1026">
<title>生日快乐 🎂</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:radial-gradient(ellipse at 50% 0%,#2a1a5e 0%,#120a2e 45%,#05030f 100%);
  color:#fff;position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;
}
#fireworks{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.stage{position:relative;z-index:2;text-align:center;padding:0 24px;width:100%}
.cake{font-size:clamp(56px,17vw,110px);line-height:1;
  animation:float 3.2s ease-in-out infinite;
  filter:drop-shadow(0 8px 24px rgba(255,180,120,.35))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.title{margin:18px 0 0;font-size:clamp(40px,13.5vw,92px);font-weight:900;
  letter-spacing:.04em;white-space:nowrap;
  filter:drop-shadow(0 0 26px rgba(255,150,180,.5))}
.title span{display:inline-block;opacity:0;transform:translateY(-36px) scale(.6);
  background:linear-gradient(180deg,#fff 0%,#ffd166 48%,#ff8fab 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:drop .85s cubic-bezier(.18,.9,.3,1.45) forwards,
            glow 2.6s ease-in-out 1.2s infinite}
.title span:nth-child(1){animation-delay:.25s,1.2s}
.title span:nth-child(2){animation-delay:.45s,1.2s}
.title span:nth-child(3){animation-delay:.65s,1.2s}
.title span:nth-child(4){animation-delay:.85s,1.2s}
@keyframes drop{to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
.sub{margin-top:22px;font-size:clamp(14px,4vw,18px);color:rgba(255,255,255,.72);
  letter-spacing:.12em;opacity:0;animation:fadeIn 1s ease 1.4s forwards}
@keyframes fadeIn{to{opacity:1}}
.btn{margin-top:34px;padding:13px 30px;font-size:16px;font-family:inherit;
  color:#1a0b2e;font-weight:700;
  background:linear-gradient(135deg,#ffd166,#ff8fab);border:none;border-radius:999px;
  cursor:pointer;box-shadow:0 10px 30px rgba(255,143,171,.35);
  opacity:0;animation:fadeIn 1s ease 1.9s forwards;transition:transform .15s}
.btn:active{transform:scale(.95)}
</style>
</head>
<body>
<canvas id="fireworks"></canvas>
<div class="stage">
  <div class="cake">🎂</div>
  <h1 class="title"><span>生</span><span>日</span><span>快</span><span>乐</span></h1>
  <p class="sub">愿你所有的愿望都能实现 ✨</p>
  <button class="btn" id="musicBtn">🎵 播放生日歌</button>
</div>
<script>
(function(){
  /* ---------- 烟花画布 ---------- */
  const canvas = document.getElementById('fireworks');
  const ctx = canvas.getContext('2d');
  let W=0, H=0;

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W*dpr);
    canvas.height = Math.floor(H*dpr);
    canvas.style.width = W+'px';
    canvas.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize,200));

  const COLORS = ['#ff4d6d','#ffd166','#06d6a0','#4cc9f0','#f72585','#ffb703','#c77dff','#ffffff'];
  const particles = [];

  function burst(x, y){
    const n = 42 + Math.random()*36;
    const base = COLORS[(Math.random()*COLORS.length)|0];
    for(let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2;
      const sp = 1.2 + Math.random()*4.2;
      particles.push({
        x, y,
        vx: Math.cos(a)*sp,
        vy: Math.sin(a)*sp,
        life: 1,
        decay: 0.008 + Math.random()*0.016,
        size: 1.2 + Math.random()*1.8,
        color: Math.random() < 0.25 ? '#ffffff' : base
      });
    }
  }

  let last = performance.now();
  function frame(now){
    const dt = Math.min((now-last)/16.67, 3);
    last = now;

    // 拖尾（透明擦除，保留 CSS 背景）
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.fillRect(0,0,W,H);

    ctx.globalCompositeOperation = 'lighter';
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx*dt;
      p.y += p.vy*dt;
      p.vy += 0.05*dt;
      p.vx *= Math.pow(0.985, dt);
      p.vy *= Math.pow(0.985, dt);
      p.life -= p.decay*dt;
      if(p.life <= 0){ particles.splice(i,1); continue; }
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // 手指/鼠标点击放烟花
  window.addEventListener('pointerdown', function(e){
    if(e.target.closest && e.target.closest('.btn')) return;
    burst(e.clientX, e.clientY);
  }, {passive:true});

  // 自动烟花
  (function auto(){
    burst(W*(0.15 + Math.random()*0.7), H*(0.1 + Math.random()*0.45));
    setTimeout(auto, 900 + Math.random()*1100);
  })();
  setTimeout(() => burst(W*0.5, H*0.4), 400);

  /* ---------- 生日歌（Web Audio 合成，无需外部音频文件） ---------- */
  // 每个元素：[频率Hz, 时长(拍)]
  const MELODY = [
    // Happy birthday to you
    [392.00,0.5],[392.00,0.25],[440.00,0.75],[392.00,0.75],[523.25,0.75],[493.88,1.5],
    // Happy birthday to you
    [392.00,0.5],[392.00,0.25],[440.00,0.75],[392.00,0.75],[587.33,0.75],[523.25,1.5],
    // Happy birthday dear ...
    [392.00,0.5],[392.00,0.25],[783.99,0.75],[659.25,0.75],[523.25,0.75],[493.88,0.75],[440.00,1.5],
    // Happy birthday to you
    [349.23,0.5],[349.23,0.25],[659.25,0.75],[523.25,0.75],[587.33,0.75],[523.25,1.5]
  ];

  let audioCtx = null;
  let playing = false;
  const btn = document.getElementById('musicBtn');

  btn.addEventListener('click', function(){
    if(playing) return;

    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();
    }catch(err){ return; }

    playing = true;
    btn.textContent = '🎶 生日快乐 ~';

    const beat = 0.42;              // 一拍约 0.42 秒
    let t = audioCtx.currentTime + 0.12;

    MELODY.forEach(function(note){
      const freq = note[0], dur = note[1]*beat;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur*0.92);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + dur);
      t += dur;
    });

    const total = MELODY.reduce(function(s,n){ return s + n[1]; }, 0) * beat;
    setTimeout(function(){
      playing = false;
      btn.textContent = '🎵 再播一次';
    }, (total + 0.4) * 1000);
  });
})();
</script>
</body>
</html>
